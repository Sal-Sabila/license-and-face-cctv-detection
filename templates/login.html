<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102b3b">
    <title>Masuk | WIKO VISION</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { color-scheme: light; --ink: #102b3b; --muted: #617782; --line: #d5e1e5; --accent: #087e8b; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; color: var(--ink); background: #edf3f2; font-family: "Segoe UI", sans-serif; }
        .login-shell { min-height: 100vh; display: grid; grid-template-columns: minmax(320px, 1fr) minmax(380px, 0.85fr); }
        .brand-panel { position: relative; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; padding: clamp(32px, 6vw, 76px); color: #f5fbfa; background: #102b3b; }
        .brand-panel::after { position: absolute; right: -160px; bottom: -260px; width: 620px; height: 620px; border: 1px solid rgba(132, 210, 200, .22); border-radius: 50%; content: ""; box-shadow: 0 0 0 55px rgba(132, 210, 200, .04), 0 0 0 110px rgba(132, 210, 200, .035); }
        .brand-lockup, .brand-copy, .brand-foot { position: relative; z-index: 1; }
        .brand-lockup { display: flex; align-items: center; gap: 13px; }
        .brand-mark { display: grid; width: 42px; aspect-ratio: 1; place-items: center; border: 1px solid rgba(255,255,255,.4); border-radius: 10px; color: #9ce0d4; font-size: 1.3rem; font-weight: 800; }
        .brand-lockup strong { display: block; font-size: .96rem; letter-spacing: .08em; }
        .brand-lockup span { color: #a7c3c6; font-size: .68rem; }
        .brand-copy { max-width: 520px; padding: 48px 0; animation: enter .55s ease-out both; }
        .brand-copy .eyebrow { color: #9ce0d4; font-size: .73rem; font-weight: 700; letter-spacing: .15em; }
        .brand-copy h1 { max-width: 480px; margin: 18px 0; font-size: clamp(2.4rem, 5vw, 4.1rem); font-weight: 650; line-height: 1.06; }
        .brand-copy p { max-width: 390px; margin: 0; color: #bbd0d2; font-size: 1rem; line-height: 1.7; }
        .brand-foot { color: #a7c3c6; font-size: .76rem; }
        .form-panel { display: grid; place-items: center; padding: 32px; background: #f8fbfa; }
        .login-form { width: min(100%, 390px); animation: enter .55s .08s ease-out both; }
        .form-kicker { color: var(--accent); font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        .login-form h2 { margin: 10px 0 6px; font-size: 2rem; font-weight: 700; }
        .login-form .intro { margin-bottom: 30px; color: var(--muted); }
        .form-label { margin-bottom: 7px; font-size: .82rem; font-weight: 650; }
        .form-control { min-height: 48px; border-color: var(--line); border-radius: 6px; }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 .2rem rgba(8,126,139,.13); }
        .input-group-text { border-color: var(--line); background: #fff; color: var(--muted); }
        .submit-btn { min-height: 48px; border: 0; border-radius: 6px; background: var(--accent); font-weight: 650; }
        .submit-btn:hover { background: #066975; }
        @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 760px) {
            .login-shell { grid-template-columns: 1fr; }
            .brand-panel { min-height: 220px; padding: 26px 24px; }
            .brand-copy { padding: 28px 0 12px; }
            .brand-copy h1 { margin: 10px 0; font-size: 2rem; }
            .brand-copy p, .brand-foot { display: none; }
            .form-panel { padding: 38px 24px 48px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; } }
    </style>
</head>
<body>
    <main class="login-shell">
        <section class="brand-panel" aria-label="Wiko Vision">
            <div class="brand-lockup">
                <div class="brand-mark">W</div>
                <div><strong>WIKO VISION</strong><span>DETEKSI MONITORING</span></div>
            </div>
            <div class="brand-copy">
                <div class="eyebrow">MONITORING CCTV</div>
                <h1>Selamat datang kembali.</h1>
                <p>Masuk untuk membuka pemantauan dan analitik kendaraan secara real-time.</p>
            </div>
            <div class="brand-foot">WIKO VISION · SISTEM MONITORING</div>
        </section>
        <section class="form-panel">
            <form class="login-form" method="post" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="next" value="{{ next_url }}">
                <div class="form-kicker">Akses operator</div>
                <h2>Masuk</h2>
                <p class="intro">Gunakan email dan password akun Anda.</p>
                {% if error %}<div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>{% endif %}
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope" aria-hidden="true"></i></span>
                        <input class="form-control" id="email" name="email" type="email" autocomplete="username" value="{{ email }}" placeholder="operator@perusahaan.com" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required>
                    </div>
                </div>
                <button class="btn btn-primary submit-btn w-100" type="submit">Masuk <i class="bi bi-arrow-right ms-1" aria-hidden="true"></i></button>
            </form>
        </section>
    </main>
</body>
</html>
